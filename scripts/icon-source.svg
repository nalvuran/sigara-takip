<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Sigara gövdesi (diyagonal) -->
  <g transform="rotate(-32 256 256)">
    <!-- filtre (kahverengi) -->
    <rect x="150" y="238" width="60" height="36" rx="6" fill="#c47a4a"/>
    <!-- beyaz gövde -->
    <rect x="210" y="238" width="140" height="36" rx="4" fill="#ffffff"/>
    <!-- kül / yanan uç -->
    <rect x="350" y="238" width="26" height="36" rx="4" fill="#e5e7eb"/>
    <rect x="372" y="238" width="10" height="36" rx="3" fill="#ef4444"/>
  </g>

  <!-- duman -->
  <path d="M 372 190 Q 392 165 372 140 Q 352 115 372 90"
        stroke="#ffffff" stroke-width="12" fill="none" stroke-linecap="round" opacity="0.85"/>
</svg>
