<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f4f6"/>
    </linearGradient>
  </defs>

  <!-- Arka plan -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Dış kırmızı halka (uluslararası "sigara içilmez" işareti) -->
  <circle cx="256" cy="256" r="188" fill="none" stroke="#dc2626" stroke-width="34"/>

  <!-- Sigara (yatay, halkanın içinde) -->
  <g>
    <rect x="132" y="234" width="56" height="44" rx="8" fill="#b5713f"/>
    <rect x="188" y="234" width="152" height="44" rx="4" fill="#ffffff"/>
    <rect x="340" y="234" width="28" height="44" rx="4" fill="#e5e7eb"/>
    <rect x="362" y="234" width="18" height="44" rx="3" fill="#f97316"/>
  </g>

  <!-- Çapraz kırmızı çizgi -->
  <line x1="126" y1="386" x2="386" y2="126" stroke="#dc2626" stroke-width="34" stroke-linecap="round"/>
</svg>
