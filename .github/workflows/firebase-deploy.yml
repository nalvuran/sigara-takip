name: Build ve Firebase'e Deploy Et

on:
  push:
    branches: [main]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Testleri çalıştır
        run: npm run test

      - name: Production build al
        run: npm run build
        env:
          # Not: Bu değerler Firebase'in istemci tarafı (client) config'idir,
          # her tarayıcının kaynak kodunda zaten görünür durumdadır - gizli
          # değildir. Güvenlik, Firestore Security Rules ile sağlanır.
          VITE_FIREBASE_API_KEY: "AIzaSyA8QAnUE3bEGW0qw-0V84I4cdFF08CLaK4"
          VITE_FIREBASE_AUTH_DOMAIN: "sigara-takip-b2f0a.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "sigara-takip-b2f0a"
          VITE_FIREBASE_STORAGE_BUCKET: "sigara-takip-b2f0a.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "842228984200"
          VITE_FIREBASE_APP_ID: "1:842228984200:web:bf1e10c7095fc8f25c323d"

      - name: Firebase Hosting'e deploy et
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          channelId: live
          projectId: sigara-takip-b2f0a

      - name: Firebase CLI kur
        run: npm install -g firebase-tools

      - name: Servis hesabı anahtarını yaz
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/gcp-key.json

      - name: Firestore kurallarını ve indekslerini deploy et
        run: firebase deploy --only firestore:rules,firestore:indexes --project sigara-takip-b2f0a
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json
