name: Build ve Firebase'e Deploy Et

on:
  push:
    branches: [main]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Testleri çalıştır
        run: npm run test

      - name: Production build al
        run: npm run build

      - name: Firebase Hosting'e deploy et
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          channelId: live
          projectId: sigara-takip-b2f0a

      - name: Firebase CLI kur
        run: npm install -g firebase-tools

      - name: Servis hesabı anahtarını yaz
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/gcp-key.json

      - name: Firestore kurallarını ve indekslerini deploy et
        run: firebase deploy --only firestore:rules,firestore:indexes --project sigara-takip-b2f0a
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json
